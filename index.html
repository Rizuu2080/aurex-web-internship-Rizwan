<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Manager | Rizwan Tariq</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>

    <main class="app-container">
        <header>
            <h1>Task Manager</h1>
            <p>Week 4 - JavaScript & DOM Manipulation</p>
        </header>

        <!-- Form for Adding & Validating Tasks -->
        <section class="task-form-section">
            <form id="task-form">
                <input type="text" id="task-input" placeholder="What needs to be done?" autocomplete="off">
                <button type="submit" id="add-task-btn">Add Task</button>
            </form>
            <span id="error-message" class="error-hidden">Task cannot be empty!</span>
        </section>

        <!-- Filtering Buttons -->
        <section class="task-filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </section>

        <!-- Dynamic Task List -->
        <section class="task-list-section">
            <ul id="task-list">
                <!-- Tasks will be injected here via JavaScript -->
                
                <!-- Example of the HTML your JavaScript will generate:
                <li class="task-item">
                    <span class="task-text">Learn JavaScript DOM</span>
                    <div class="task-actions">
                        <button class="icon-btn complete-btn">✓</button>
                        <button class="icon-btn edit-btn">✎</button>
                        <button class="icon-btn delete-btn">✗</button>
                    </div>
                </li>
                -->
            </ul>
        </section>
    </main>
    
    <script src="scripts/main.js"></script>
</body>
</html>
